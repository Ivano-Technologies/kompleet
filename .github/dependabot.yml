# Dependabot configuration for KOMPLEET
#
# Policy (docs/BRANCHING.md, adopted 2026-08-05):
#   Version updates: OFF. Security updates: ON.
#
# Why version updates are off
#   Weekly grouped minor/patch PRs and individual majors produced a standing
#   backlog of Dependabot branches that could not drain under the two-branch
#   model (staging + main only). Routine currency is a quarterly review, not
#   a continuous PR stream.
#
# Why security updates stay on
#   This repository is public and handles financial data. CVE patching must
#   keep flowing. Disabling Dependabot entirely to tidy a branch list is a
#   bad trade — this project has already hit an xlsx advisory and a broken
#   audit gate in one cycle. Security PRs should auto-merge on green
#   (repo setting: Allow auto-merge). OSV scan + audit-ci remain the CI backstop.
#
# How this file does that
#   `open-pull-requests-limit: 0` stops version-update PRs. It does not stop
#   Dependabot security updates
#   (https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file#open-pull-requests-limit).
#   The `security-updates` group keeps CVE bumps batched per ecosystem.
#   Do not delete this file or the `updates` entries — that would disable
#   Dependabot config for these ecosystems.

version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - security
      - web
    allow:
      - dependency-type: direct
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native-firebase/*"
      - dependency-name: "@react-navigation/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/apps/mobile"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - security
      - mobile
    allow:
      - dependency-type: direct
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - security
      - ci
    commit-message:
      prefix: "ci(deps)"
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
