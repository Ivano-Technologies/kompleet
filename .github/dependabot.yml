version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - security
    allow:
      - dependency-type: direct
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
