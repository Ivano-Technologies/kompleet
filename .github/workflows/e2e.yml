# Playwright e2e is not part of push/PR CI. Run it by hand:
#   pnpm test:e2e
# or from Actions → E2E → Run workflow.

name: E2E

on:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  e2e:
    name: e2e
    # IVA-235: Node 22 is required so isolated Convex can deploy "use node"
    # actions.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    env:
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          # IVA-235: Convex local backend needs Node 22 or 24 for "use node"
          # actions (convex/backfill.ts). Node 20 fails provision with
          # DeploymentNotConfiguredForNodeActions.
          node-version: 22
          cache: pnpm

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile

      # Browser binaries are keyed on the Playwright version so a lockfile bump
      # invalidates the cache automatically.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # Path B: authenticated money-path specs write through Convex
      # (transactions / expenses / export history). When Playwright boots
      # `pnpm dev` locally, those routes need a live NEXT_PUBLIC_CONVEX_URL.
      # Prefer a repo variable if Shipping already created a deployment;
      # otherwise provision an isolated anonymous Convex for this job.
      # Skip when E2E_BASE_URL points at a deployed environment.
      - name: Provision Convex for local e2e
        if: ${{ vars.E2E_BASE_URL == '' }}
        env:
          CONVEX_AGENT_MODE: anonymous
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_CONVEX_URL: ${{ vars.NEXT_PUBLIC_CONVEX_URL }}
        run: bash scripts/ci-provision-convex.sh

      # Target is configurable. Set the repository variable E2E_BASE_URL
      # (Settings -> Secrets and variables -> Actions -> Variables) to run the
      # suite against staging or a preview deployment. When it is empty
      # Playwright boots `pnpm dev` on http://localhost:3000 itself.
      #
      # The authenticated specs skip themselves (rather than fail) when
      # E2E_USER_EMAIL / E2E_USER_PASSWORD are not configured, so forks without
      # access to the test account still get the unauthenticated coverage.
      # See e2e/README.md for what to seed.
      - name: Run Playwright E2E suite
        run: pnpm test:e2e
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          # Legacy anon JWTs are disabled on this project; login needs the
          # publishable key so GoTrue will mint a session.
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'http://localhost:3000' }}
          # Set by the provision step (GITHUB_ENV) or the repo variable.
          NEXT_PUBLIC_CONVEX_URL: ${{ env.NEXT_PUBLIC_CONVEX_URL || vars.NEXT_PUBLIC_CONVEX_URL }}
          # Isolated Convex has no Resend key. Read secret for stored OTPs;
          # must match scripts/ci-provision-convex.sh. Not the verification code.
          AUTH_E2E_OTP: "42424242"

      - name: Prune old Playwright report artifacts
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # IVA-235: GitHub Actions artifact quota was full on main@2f9df16.
          ids="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("playwright-report-")) | .id' || true)"
          if [[ -z "${ids}" ]]; then
            echo "No playwright-report artifacts to prune"
            exit 0
          fi
          count=0
          while IFS= read -r id; do
            [[ -z "${id}" ]] && continue
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" >/dev/null
            count=$((count + 1))
          done <<< "${ids}"
          echo "Deleted ${count} old Playwright report artifacts"

      - name: Upload Playwright report
        if: always()
        # Pinned to the v4.6.2 commit for supply-chain hardening.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 3
          if-no-files-found: ignore
