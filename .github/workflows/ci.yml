name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  # This repository is PUBLIC by deliberate choice. Any credential that reaches
  # a commit is world-readable within seconds, so secret scanning blocks the
  # pipeline ahead of every other job.
  secrets:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # Scan the checked-out tree only (--no-git), not full history.
      #
      # History rewrite was declined (docs/SECRET_EXPOSURE_REMEDIATION.md §4);
      # known leaked credentials remain in old commits until rotation makes them
      # inert. A full-history scan would stay red forever, and a gitleaks
      # baseline JSON re-embeds Secret values — unsuitable for a public repo.
      #
      # Using the gitleaks binary directly (not gitleaks-action) avoids the
      # org-license requirement that would otherwise block this public org repo.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan working tree for secrets
        run: gitleaks detect --source . --config .gitleaks.toml --no-git --verbose --exit-code 1

  # Static scan — no DB credentials, no pnpm install. Blocks like secret-scan.
  # Script lands with #80 (PR 3a); until then this job fails closed if the
  # file is missing, which is the correct failure mode for a rate-shadow guard.
  tax-rates:
    name: check-tax-rates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Check no hardcoded tax rates
        run: node scripts/check-no-hardcoded-tax-rates.mjs

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: pnpm

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

  build:
    name: build
    needs: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: pnpm

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Restore Next.js cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Attempt automatic security fixes
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        run: node scripts/security-fix.mjs

      - name: Check for modified lockfile
        run: git diff --exit-code pnpm-lock.yaml

      - name: Run security gate
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        run: node scripts/audit-ci.mjs

      - name: Run OSV vulnerability scan
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        # Pinned to the v2.5.0 commit for supply-chain hardening.
        uses: google/osv-scanner-action/osv-scanner-action@8deb546fdb875b9996d27d4950be7312dac076a1
        continue-on-error: true

      - run: pnpm build
        env:
          CI: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Canonical host is NOT baked into the image. Set the repository (or
          # environment) variable NEXT_PUBLIC_SITE_URL in GitHub → Settings →
          # Secrets and variables → Actions → Variables. The literal below is a
          # build-time fallback only, so CI still builds on forks where the
          # variable is not defined. The value that actually ships is the one
          # set per-environment on the Vercel project.
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://kompleet.techivano.com' }}
          SUPABASE_SERVICE_ROLE_KEY: "eyJ_ci_placeholder_for_build"
          OPENAI_API_KEY: "sk-ci_placeholder_for_build"
          DATABASE_URL: "postgresql://ci@localhost:5432/ci_build"

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: pnpm

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm test
        env:
          CI: "true"
          NEXT_PUBLIC_SUPABASE_URL: "http://localhost:54321"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJ_test_placeholder"
          SUPABASE_SERVICE_ROLE_KEY: "eyJ_test_placeholder"
          OPENAI_API_KEY: "sk-test_placeholder"
          DATABASE_URL: "postgresql://test@localhost:5432/test"

  # Wave B (PHASE_3_BRIEF §5). Local Supabase — real JWTs, no hosted secrets.
  # Default `pnpm test` skips these files (src/test/setup.ts clobbers NEXT_PUBLIC_*).
  rls-negative:
    name: rls-negative
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          # supabase-js 2.112 needs native WebSocket (Node 22+). Node 20 throws
          # "native WebSocket not found" at createClient in this job.
          node-version: 22
          cache: pnpm

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile

      - name: Start local Supabase
        run: pnpm supabase start

      - name: Run cross-tenant negative suite
        env:
          CI: "true"
          KOMPLEET_RLS_REQUIRE: "1"
        run: |
          set -euo pipefail
          unquote() {
            local v="$1"
            v="${v#\"}"
            v="${v%\"}"
            printf '%s' "$v"
          }
          while IFS= read -r line; do
            case "$line" in
              API_URL=*) KOMPLEET_RLS_URL="$(unquote "${line#API_URL=}")" ;;
              ANON_KEY=*) KOMPLEET_RLS_ANON_KEY="$(unquote "${line#ANON_KEY=}")" ;;
              SERVICE_ROLE_KEY=*) KOMPLEET_RLS_SERVICE_ROLE_KEY="$(unquote "${line#SERVICE_ROLE_KEY=}")" ;;
              DB_URL=*) KOMPLEET_RLS_DATABASE_URL="$(unquote "${line#DB_URL=}")" ;;
            esac
          done < <(pnpm supabase status -o env)
          if [ -z "${KOMPLEET_RLS_URL:-}" ] || [ -z "${KOMPLEET_RLS_ANON_KEY:-}" ] || [ -z "${KOMPLEET_RLS_SERVICE_ROLE_KEY:-}" ] || [ -z "${KOMPLEET_RLS_DATABASE_URL:-}" ]; then
            echo "::error::Failed to parse local Supabase credentials from supabase status"
            exit 1
          fi
          export KOMPLEET_RLS_URL KOMPLEET_RLS_ANON_KEY KOMPLEET_RLS_SERVICE_ROLE_KEY KOMPLEET_RLS_DATABASE_URL
          pnpm test:rls

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: pnpm

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: pnpm

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile

      # Browser binaries are keyed on the Playwright version so a lockfile bump
      # invalidates the cache automatically.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # Target is configurable. Set the repository variable E2E_BASE_URL
      # (Settings -> Secrets and variables -> Actions -> Variables) to run the
      # suite against staging or a preview deployment. When it is empty
      # Playwright boots `pnpm dev` on http://localhost:3000 itself.
      #
      # The authenticated specs skip themselves (rather than fail) when
      # E2E_USER_EMAIL / E2E_USER_PASSWORD are not configured, so forks without
      # access to the test account still get the unauthenticated coverage.
      # See e2e/README.md for what to seed.
      - name: Run Playwright E2E suite
        run: pnpm test:e2e
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          # Legacy anon JWTs are disabled on this project; login needs the
          # publishable key so GoTrue will mint a session.
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'http://localhost:3000' }}

      - name: Upload Playwright report
        if: always()
        # Pinned to the v4.6.2 commit for supply-chain hardening.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Schema / migration / advisor guardrails (Phase 1)
  # Gate on credential availability, not authorship. Forks and Dependabot PRs
  # lack DATABASE_URL / SUPABASE_ACCESS_TOKEN (and must not receive them in
  # Dependabot secrets — those are a supply-chain exfiltration path). When the
  # secret is empty the check step skips; whoever opened the PR, the job stays
  # green. Do not add `if: github.actor != 'dependabot[bot]'` or fork allowlists.
  # Dependabot secrets should carry only NEXT_PUBLIC_SUPABASE_URL and
  # NEXT_PUBLIC_SUPABASE_ANON_KEY (public by design) so build/typecheck/test/lint run.
  # ---------------------------------------------------------------------------
  schema-drift:
    name: check-schema-drift
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # `users` exists only as auth.users; public.users was never created.
      SCHEMA_DRIFT_IGNORE: users
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        if: env.DATABASE_URL != ''

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: env.DATABASE_URL != ''
        with:
          node-version: 20
          cache: pnpm

      - if: env.DATABASE_URL != ''
        run: pnpm install --frozen-lockfile

      # Ratchet: fails only when missing count exceeds `.schema-drift-baseline`.
      # Phase 3 waves must decrement that file by the number of tables added.
      - name: Check schema drift
        if: env.DATABASE_URL != ''
        run: pnpm check:schema-drift

  migrations:
    name: check-migrations-applied
    runs-on: ubuntu-latest
    env:
      # Script uses Session-pooler DATABASE_URL via --db-url (not the access token).
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        if: env.DATABASE_URL != ''

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: env.DATABASE_URL != ''
        with:
          node-version: 20
          cache: pnpm

      - if: env.DATABASE_URL != ''
        run: pnpm install --frozen-lockfile

      - name: Check migrations applied
        if: env.DATABASE_URL != ''
        run: pnpm check:migrations

  security-advisors:
    name: check-security-advisors
    runs-on: ubuntu-latest
    # SUPABASE_ACCESS_TOKEN is account-wide (every project in the org), not
    # scoped to this project alone — treat it as high-sensitivity. Never put
    # it in Dependabot secrets.
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'frlcvkmjuhnjcicwywrh' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        if: env.SUPABASE_ACCESS_TOKEN != ''

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          node-version: 20
          cache: pnpm

      - if: env.SUPABASE_ACCESS_TOKEN != ''
        run: pnpm install --frozen-lockfile

      - name: Gate security advisors against baseline
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: pnpm check:security-advisors
