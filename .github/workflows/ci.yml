name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - run: pnpm install --frozen-lockfile

      - name: Security audit (high severity gate)
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        run: |
          echo "Running production dependency audit..."
          pnpm audit:ci || {
            echo "High or critical vulnerability detected. Failing build."
            exit 1
          }

      - run: pnpm build
        env:
          CI: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: https://kompleet.ng
          SUPABASE_SERVICE_ROLE_KEY: "eyJ_ci_placeholder_for_build"
          OPENAI_API_KEY: "sk-ci_placeholder_for_build"
          DATABASE_URL: "postgresql://ci:placeholder@localhost:5432/ci_build"

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test
        env:
          CI: "true"
          NEXT_PUBLIC_SUPABASE_URL: "http://localhost:54321"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJ_test_placeholder"
          SUPABASE_SERVICE_ROLE_KEY: "eyJ_test_placeholder"
          OPENAI_API_KEY: "sk-test_placeholder"
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
