name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  # Job id must not be `secrets` — that name is reserved (same as the secrets
  # context) and GitHub can skip the job entirely. `build` used to `needs:
  # secrets`, so when secret-scan never started, build never started either.
  # Jobs are independent so a scheduler drop of one does not skip the rest.
  secret_scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # Scan the checked-out tree only (--no-git), not full history.
      #
      # History rewrite was declined (docs/SECRET_EXPOSURE_REMEDIATION.md §4);
      # known leaked credentials remain in old commits until rotation makes them
      # inert. A full-history scan would stay red forever, and a gitleaks
      # baseline JSON re-embeds Secret values — unsuitable for a public repo.
      #
      # Using the gitleaks binary directly (not gitleaks-action) avoids the
      # org-license requirement that would otherwise block this public org repo.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan working tree for secrets
        run: gitleaks detect --source . --config .gitleaks.toml --no-git --verbose --exit-code 1

  # Static scan — no DB credentials, no pnpm install. Blocks like secret-scan.
  # Script lands with #80 (PR 3a); until then this job fails closed if the
  # file is missing, which is the correct failure mode for a rate-shadow guard.
  tax-rates:
    name: check-tax-rates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Check no hardcoded tax rates
        run: node scripts/check-no-hardcoded-tax-rates.mjs

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: pnpm

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: pnpm

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Restore Next.js cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Attempt automatic security fixes
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        run: node scripts/security-fix.mjs

      - name: Check for modified lockfile
        run: git diff --exit-code pnpm-lock.yaml

      - name: Run security gate
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        run: node scripts/audit-ci.mjs

      - name: Run OSV vulnerability scan
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        # Pinned to the v2.5.0 commit for supply-chain hardening.
        uses: google/osv-scanner-action/osv-scanner-action@8deb546fdb875b9996d27d4950be7312dac076a1
        continue-on-error: true

      - run: pnpm build
        env:
          CI: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_CONVEX_URL: ${{ vars.NEXT_PUBLIC_CONVEX_URL || 'https://placeholder.convex.cloud' }}
          # Canonical host is NOT baked into the image. Set the repository (or
          # environment) variable NEXT_PUBLIC_SITE_URL in GitHub → Settings →
          # Secrets and variables → Actions → Variables. The literal below is a
          # build-time fallback only, so CI still builds on forks where the
          # variable is not defined. The value that actually ships is the one
          # set per-environment on the Vercel project.
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://kompleet.techivano.com' }}
          SUPABASE_SERVICE_ROLE_KEY: "eyJ_ci_placeholder_for_build"
          OPENAI_API_KEY: "sk-ci_placeholder_for_build"
          DATABASE_URL: "postgresql://ci@localhost:5432/ci_build"

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: pnpm

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm test
        env:
          CI: "true"
          NEXT_PUBLIC_SUPABASE_URL: "http://localhost:54321"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJ_test_placeholder"
          NEXT_PUBLIC_CONVEX_URL: "https://placeholder.convex.cloud"
          SUPABASE_SERVICE_ROLE_KEY: "eyJ_test_placeholder"
          OPENAI_API_KEY: "sk-test_placeholder"
          DATABASE_URL: "postgresql://test@localhost:5432/test"

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: pnpm

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
