name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  # This repository is PUBLIC by deliberate choice. Any credential that reaches
  # a commit is world-readable within seconds, so secret scanning blocks the
  # pipeline ahead of every other job.
  secrets:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # Scan the checked-out tree only (--no-git), not full history.
      #
      # History rewrite was declined (docs/SECRET_EXPOSURE_REMEDIATION.md §4);
      # known leaked credentials remain in old commits until rotation makes them
      # inert. A full-history scan would stay red forever, and a gitleaks
      # baseline JSON re-embeds Secret values — unsuitable for a public repo.
      #
      # Using the gitleaks binary directly (not gitleaks-action) avoids the
      # org-license requirement that would otherwise block this public org repo.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan working tree for secrets
        run: gitleaks detect --source . --config .gitleaks.toml --no-git --verbose --exit-code 1

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: pnpm

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

  build:
    name: build
    needs: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: pnpm

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Restore Next.js cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Attempt automatic security fixes
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        run: node scripts/security-fix.mjs

      - name: Check for modified lockfile
        run: git diff --exit-code pnpm-lock.yaml

      - name: Run security gate
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        run: node scripts/audit-ci.mjs

      - name: Run OSV vulnerability scan
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        # Pinned to the v2.3.3 commit for supply-chain hardening.
        uses: google/osv-scanner-action/osv-scanner-action@c5996e0193a3df57d695c1b8a1dec2a4c62e8730
        continue-on-error: true

      - run: pnpm build
        env:
          CI: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Canonical host is NOT baked into the image. Set the repository (or
          # environment) variable NEXT_PUBLIC_SITE_URL in GitHub → Settings →
          # Secrets and variables → Actions → Variables. The literal below is a
          # build-time fallback only, so CI still builds on forks where the
          # variable is not defined. The value that actually ships is the one
          # set per-environment on the Vercel project.
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://kompleet.techivano.com' }}
          SUPABASE_SERVICE_ROLE_KEY: "eyJ_ci_placeholder_for_build"
          OPENAI_API_KEY: "sk-ci_placeholder_for_build"
          DATABASE_URL: "postgresql://ci@localhost:5432/ci_build"

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: pnpm

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm test
        env:
          CI: "true"
          NEXT_PUBLIC_SUPABASE_URL: "http://localhost:54321"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJ_test_placeholder"
          SUPABASE_SERVICE_ROLE_KEY: "eyJ_test_placeholder"
          OPENAI_API_KEY: "sk-test_placeholder"
          DATABASE_URL: "postgresql://test@localhost:5432/test"

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: pnpm

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Phase 9 owns a seeded email-confirmed user + E2E_BASE_URL. Until then
    # unauthenticated/auth-flow specs flake or fail against incomplete markup;
    # do not block merge on that sequencing debt. Remove continue-on-error when
    # e2e/README.md prerequisites are met.
    continue-on-error: true
    env:
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: pnpm

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile

      # Browser binaries are keyed on the Playwright version so a lockfile bump
      # invalidates the cache automatically.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # Target is configurable. Set the repository variable E2E_BASE_URL
      # (Settings -> Secrets and variables -> Actions -> Variables) to run the
      # suite against staging or a preview deployment. When it is empty
      # Playwright boots `pnpm dev` on http://localhost:3000 itself.
      #
      # The authenticated specs skip themselves (rather than fail) when
      # E2E_USER_EMAIL / E2E_USER_PASSWORD are not configured, so forks without
      # access to the test account still get the unauthenticated coverage.
      # See e2e/README.md for what to seed.
      - name: Run Playwright E2E suite
        run: pnpm test:e2e
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'http://localhost:3000' }}

      - name: Upload Playwright report
        if: always()
        # Pinned to the v4.6.2 commit for supply-chain hardening.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Schema / migration / advisor guardrails (Phase 1)
  # These jobs fail closed when secrets are configured. Forks without the
  # secrets skip via the `if:` guards so Dependabot/community PRs stay green.
  # ---------------------------------------------------------------------------
  schema-drift:
    name: check-schema-drift
    runs-on: ubuntu-latest
    # Repo is public: GitHub does not pass secrets to fork PR workflows.
    # Without this guard the job fails (missing DATABASE_URL) instead of skipping.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Expected to fail until Phase 2 deletions + Phase 3 table creation land.
      # First measured count on 2026-08-03: 27 missing tables (not the 14 in the
      # prior recovery-plan inventory — see docs/STATUS.md).
      - name: Detect .from() references to missing tables
        run: pnpm check:schema-drift
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # `users` exists only as auth.users; public.users was never created.
          SCHEMA_DRIFT_IGNORE: users

  migrations:
    name: check-migrations-applied
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Compare local vs remote migrations
        run: pnpm check:migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'frlcvkmjuhnjcicwywrh' }}

  security-advisors:
    name: check-security-advisors
    runs-on: ubuntu-latest
    # SUPABASE_ACCESS_TOKEN is account-wide (every project in the org), not
    # scoped to this project alone — treat it as high-sensitivity.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Gate security advisors against baseline
        run: pnpm check:security-advisors
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'frlcvkmjuhnjcicwywrh' }}
