name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Attempt automatic security fixes
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        run: node scripts/security-fix.mjs

      - name: Check for modified lockfile
        run: git diff --exit-code pnpm-lock.yaml

      - name: Run security gate
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        run: node scripts/audit-ci.mjs

      - name: Run OSV vulnerability scan
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        uses: google/osv-scanner-action@v2.3.3
        continue-on-error: true

      - run: pnpm build
        env:
          CI: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: https://kompleet.ng
          SUPABASE_SERVICE_ROLE_KEY: "eyJ_ci_placeholder_for_build"
          OPENAI_API_KEY: "sk-ci_placeholder_for_build"
          DATABASE_URL: "postgresql://ci:placeholder@localhost:5432/ci_build"

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm test
        env:
          CI: "true"
          NEXT_PUBLIC_SUPABASE_URL: "http://localhost:54321"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJ_test_placeholder"
          SUPABASE_SERVICE_ROLE_KEY: "eyJ_test_placeholder"
          OPENAI_API_KEY: "sk-test_placeholder"
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
