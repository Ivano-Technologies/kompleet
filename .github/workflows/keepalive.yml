# Database keep-alive for the free-tier Supabase project.
#
# Free-tier projects pause after 7 days of database inactivity. This job hits
# PostgREST directly (one `tax_rules` select) every 3 days so a single missed
# run still leaves a recovery window. Fail the workflow on non-200 — a silent
# keep-alive failure is worse than none.
#
# Do not route this ping through Vercel. GitHub Actions IPs are challenged by
# Cloudflare Bot Fight on the custom domain (HTTP 403 HTML), and the Vercel
# path is an extra hop for a database liveness check.
#
# GET /api/health/db remains the uptime-monitor probe (token via Vercel
# KEEPALIVE_TOKEN / x-keepalive-token). This workflow does not call it.
#
# Caveats (accepted, time-limited; see docs/STATUS.md):
# 1. GitHub disables scheduled workflows in public repos after 60 days without
#    commit activity. Dependabot security updates normally prevent this; a quiet
#    repo kills the keep-alive exactly when it matters.
# 2. This is a workaround for a free-tier limit, not a fix. Supabase Pro
#    (~$25/mo) does not pause. Revisit before real users exist.
#
# Required GitHub config (owner):
#   secrets.SUPABASE_PUBLISHABLE_KEY — project publishable key (anon role).
#     Legacy anon JWTs may be disabled; use the sb_publishable_ key.
# Anon SELECT on tax_rules is granted by 20260813210027 (keep-alive only;
# RLS still hides all rows from anon). Do not revoke that grant.

name: Database keep-alive

on:
  schedule:
    # 05:17 UTC every 3rd day-of-month (1, 4, 7, …). Offset from round hours.
    - cron: "17 5 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query PostgREST tax_rules
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_PUBLISHABLE_KEY:-}" ]; then
            echo "::error::GitHub Actions secret SUPABASE_PUBLISHABLE_KEY is not set"
            exit 1
          fi
          url="https://frlcvkmjuhnjcicwywrh.supabase.co/rest/v1/tax_rules?select=id&limit=1"
          echo "GET ${url}"
          code=$(curl -sS -o /tmp/keepalive-body -w "%{http_code}" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Accept: application/json" \
            -A "KompleetKeepalive/1.0" \
            --max-time 30 \
            "$url")
          echo "HTTP ${code}"
          cat /tmp/keepalive-body || true
          echo
          if [ "$code" != "200" ]; then
            echo "::error::Keep-alive failed: expected HTTP 200, got ${code}"
            exit 1
          fi
