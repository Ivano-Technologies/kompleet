<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1200" viewBox="0 0 960 1200" fill="none" role="img" aria-label="Kompleet auth panel — geometric ledger stack">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#072A45"/>
      <stop offset="100%" stop-color="#0B3A5C"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#072A45" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="960" height="1200" fill="url(#bg)"/>
  <!-- subtle grid -->
  <g stroke="#1B6CA8" stroke-opacity="0.25" stroke-width="1">
    <path d="M0 200 H960 M0 400 H960 M0 600 H960 M0 800 H960 M0 1000 H960"/>
    <path d="M160 0 V1200 M320 0 V1200 M480 0 V1200 M640 0 V1200 M800 0 V1200"/>
  </g>
  <!-- back document -->
  <g filter="url(#soft)">
    <rect x="220" y="280" width="420" height="560" rx="24" fill="#EBE6DC" transform="rotate(-6 430 560)"/>
  </g>
  <!-- mid document -->
  <g filter="url(#soft)">
    <rect x="260" y="300" width="420" height="560" rx="24" fill="#FFFDF8" transform="rotate(3 470 580)"/>
    <rect x="300" y="360" width="280" height="10" rx="5" fill="#DDD5C8" transform="rotate(3 470 580)"/>
    <rect x="300" y="390" width="240" height="10" rx="5" fill="#DDD5C8" transform="rotate(3 470 580)"/>
    <rect x="300" y="420" width="260" height="10" rx="5" fill="#DDD5C8" transform="rotate(3 470 580)"/>
    <rect x="300" y="450" width="200" height="10" rx="5" fill="#DDD5C8" transform="rotate(3 470 580)"/>
  </g>
  <!-- front document -->
  <g filter="url(#soft)">
    <rect x="280" y="340" width="440" height="580" rx="24" fill="#FFFDF8"/>
    <rect x="280" y="340" width="440" height="64" rx="24" fill="#0B3A5C"/>
    <rect x="280" y="380" width="440" height="24" fill="#0B3A5C"/>
    <!-- lines -->
    <rect x="320" y="440" width="300" height="12" rx="6" fill="#EBE6DC"/>
    <rect x="320" y="480" width="260" height="12" rx="6" fill="#EBE6DC"/>
    <rect x="320" y="520" width="280" height="12" rx="6" fill="#EBE6DC"/>
    <rect x="320" y="560" width="220" height="12" rx="6" fill="#EBE6DC"/>
    <rect x="320" y="620" width="360" height="1" fill="#DDD5C8"/>
    <rect x="320" y="660" width="280" height="12" rx="6" fill="#EBE6DC"/>
    <rect x="320" y="700" width="300" height="12" rx="6" fill="#EBE6DC"/>
    <rect x="320" y="740" width="240" height="12" rx="6" fill="#EBE6DC"/>
    <!-- Naira glyph -->
    <g transform="translate(360 820)">
      <rect x="0" y="0" width="72" height="72" rx="16" fill="#0B3A5C"/>
      <text x="36" y="48" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="700" fill="#FFFDF8">₦</text>
    </g>
    <!-- teal verified seal -->
    <circle cx="640" cy="856" r="28" fill="#0D9488"/>
    <path d="M628 856 l8 8 16 -18" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <!-- wordmark hint (not logo redraw) -->
  <text x="480" y="1100" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="4" fill="#BAD8F5" fill-opacity="0.7">KOMPLEET</text>
</svg>
