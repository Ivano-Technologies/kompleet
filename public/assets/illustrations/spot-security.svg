<svg xmlns="http://www.w3.org/2000/svg" width="88" height="88" viewBox="0 0 88 88" fill="none" role="img" aria-label="Shield and lock">
  <!-- shield -->
  <path d="M44 14 L68 24 V42 c0 16 -10 26 -24 32 C30 68 20 58 20 42 V24 Z"
        fill="#FFFDF8" stroke="#0B3A5C" stroke-width="1.75" stroke-linejoin="round"/>
  <!-- lock body -->
  <rect x="35" y="42" width="18" height="14" rx="3" stroke="#0B3A5C" stroke-width="1.75"/>
  <!-- lock shackle -->
  <path d="M39 42 V36 c0 -3.5 2.5 -6 5 -6 s5 2.5 5 6 V42" stroke="#0B3A5C" stroke-width="1.75" stroke-linecap="round" fill="none"/>
  <!-- keyhole -->
  <circle cx="44" cy="48" r="2" fill="#0B3A5C"/>
  <rect x="43" y="48" width="2" height="4" rx="0.5" fill="#0B3A5C"/>
</svg>
