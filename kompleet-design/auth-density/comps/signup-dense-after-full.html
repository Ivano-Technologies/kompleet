<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/>
<title>Signup dense AFTER · 1366×768</title>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&display=swap"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"/>
<style>
@font-face{font-family:Ceoruse;src:url("/workspace/kompleet/public/fonts/ceoruse.otf") format("opentype");font-weight:700}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1366px;height:768px;overflow:hidden;font-family:Montserrat,system-ui,sans-serif;color:#0D1B2A}
.shell{display:flex;width:1366px;height:768px;background:#F4F1EB}
.art{width:50%;background:#072A45;position:relative}
.art::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 30% 40%,rgba(13,148,136,.18),transparent 55%),linear-gradient(160deg,#072A45,#0B3A5C 55%,#0a2f4a)}
.form{width:50%;display:flex;align-items:center;justify-content:center;padding:20px 24px;background:#F4F1EB}
.card{width:100%;max-width:440px;background:#FFFDF8;border:1px solid #DDD5C8;border-radius:16px;box-shadow:0 4px 16px rgba(11,58,92,.08);padding:22px 24px}
.wm{font-family:Ceoruse,"Clash Display",sans-serif;font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:18px;color:#0B3A5C;text-align:center;margin-bottom:12px}
.addon{font-size:13px;color:#6B7280;text-align:right;margin-bottom:8px}
.addon a{color:#0B3A5C;font-weight:700;text-decoration:none}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#9CA3AF;margin-bottom:4px}
.title{font-family:"Clash Display",Montserrat,sans-serif;font-weight:700;font-size:26px;color:#0D1B2A;letter-spacing:-.02em;margin-bottom:4px}
.sub{font-size:13px;color:#6B7280;margin-bottom:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fields{display:flex;flex-direction:column;gap:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#3D4A55;margin-bottom:4px}
input{width:100%;height:42px;border:1px solid #DDD5C8;border-radius:10px;background:#FFFDF8;font-family:inherit;font-size:13px;padding:0 12px}
.btn{width:100%;height:42px;margin-top:4px;border:none;border-radius:10px;background:#0D9488;color:#fff;font-family:inherit;font-size:13px;font-weight:700}
.terms{text-align:center;font-size:11px;color:#9CA3AF;margin-top:12px;line-height:1.4}
.terms a{color:#0B3A5C;font-weight:600;text-decoration:none}
.trust{display:flex;align-items:center;justify-content:center;gap:12px;font-size:11px;color:#9CA3AF;border-top:1px solid #DDD5C8;margin-top:12px;padding-top:12px}
</style></head><body>
<div class="shell">
  <div class="art"></div>
  <div class="form"><div class="card">
    <div class="wm">Kompleet</div>
    <div class="addon">Already have an account? <a href="#">Log in</a></div>
    <div class="eyebrow">Create Account</div>
    <div class="title">Sign up</div>
    <div class="sub">Track your spending, handle invoices, and avoid surprises.</div>
    <div class="fields">
      <div class="row2">
        <div><label>First Name</label><input placeholder="e.g. Tunde"/></div>
        <div><label>Last Name</label><input placeholder="e.g. Balogun"/></div>
      </div>
      <div><label>Business Name</label><input placeholder="e.g. Tunde Ventures Ltd"/></div>
      <div><label>Business Email</label><input placeholder="name@company.ng"/></div>
      <div><label>Password</label><input type="password" placeholder="Minimum 8 characters"/></div>
      <button class="btn" type="button">Create Free Account →</button>
    </div>
    <p class="terms">By signing up, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></p>
    <div class="trust"><span>NDPR Compliant</span><span>·</span><span>256-bit SSL</span></div>
  </div></div>
</div>
</body></html>
