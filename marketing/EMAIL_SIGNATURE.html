<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>KOMPLEET Email Signature</title>
</head>
<body>
    <!-- KOMPLEET Email Signature Template -->
    <!-- Copy and paste this HTML into your email client's signature settings -->
    
    <table cellpadding="0" cellspacing="0" border="0" style="font-family: Arial, sans-serif; font-size: 14px; color: #333333; max-width: 500px;">
        <tr>
            <td style="padding-bottom: 15px;">
                <table cellpadding="0" cellspacing="0" border="0">
                    <tr>
                        <!-- Logo -->
                        <td style="padding-right: 15px; vertical-align: middle;">
                            <img src="https://kompleet.ng/assets/logo-primary.png" alt="KOMPLEET" style="width: 50px; height: 50px; border-radius: 8px;" />
                        </td>
                        <!-- Name and Title -->
                        <td style="vertical-align: middle;">
                            <div style="font-size: 16px; font-weight: bold; color: #0A6847; margin-bottom: 2px;">[Your Name]</div>
                            <div style="font-size: 13px; color: #666666;">[Your Title]</div>
                            <div style="font-size: 14px; font-weight: 600; color: #333333; margin-top: 4px;">KOMPLEET</div>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
        
        <!-- Contact Information -->
        <tr>
            <td style="padding-bottom: 12px; border-top: 1px solid #E5E7EB; padding-top: 12px;">
                <table cellpadding="0" cellspacing="0" border="0" style="font-size: 13px; color: #666666;">
                    <tr>
                        <td style="padding-bottom: 4px;">
                            📧 <a href="mailto:[your.email@kompleet.ng]" style="color: #0A6847; text-decoration: none;">[your.email@kompleet.ng]</a>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding-bottom: 4px;">
                            📱 <a href="tel:+234XXXXXXXXXX" style="color: #0A6847; text-decoration: none;">+234 XXX XXX XXXX</a>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding-bottom: 4px;">
                            🌐 <a href="https://kompleet.ng" style="color: #0A6847; text-decoration: none;">kompleet.ng</a>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
        
        <!-- Tagline -->
        <tr>
            <td style="padding-top: 8px; padding-bottom: 12px; border-top: 1px solid #E5E7EB;">
                <div style="font-size: 11px; color: #999999; font-style: italic;">
                    Kompleet records. Kompleet filings. Kompleet compliance.
                </div>
            </td>
        </tr>
        
        <!-- Call to Action (Optional) -->
        <tr>
            <td style="padding-top: 8px;">
                <a href="https://kompleet.ng/signup" style="display: inline-block; background-color: #0A6847; color: white; padding: 8px 16px; text-decoration: none; border-radius: 6px; font-size: 12px; font-weight: 600;">
                    Start Free Trial
                </a>
            </td>
        </tr>
        
        <!-- Footer -->
        <tr>
            <td style="padding-top: 15px; font-size: 10px; color: #999999;">
                <div>Ivano Technologies Ltd | Nigeria</div>
                <div style="margin-top: 4px;">Tax Compliance & Financial Management Platform</div>
            </td>
        </tr>
    </table>
</body>
</html>
